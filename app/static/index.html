<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RelayTrace — evidence-linked handover</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  mark{background:#fde68a;padding:0 2px;border-radius:3px}
  pre{white-space:pre-wrap;word-break:break-word}
  code{background:#eef2ff;color:#4338ca;padding:0 4px;border-radius:4px;font-size:.85em}
  .card{transition:box-shadow .15s,transform .15s}
  .card:hover{box-shadow:0 4px 14px rgba(79,70,229,.10)}
  .card.sel{box-shadow:0 0 0 2px #6366f1}
  .tip{position:relative}
  .tip:hover::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
    background:#0f172a;color:#fff;font-size:11px;line-height:1.35;padding:6px 8px;border-radius:6px;width:max-content;max-width:230px;
    white-space:normal;text-align:left;z-index:60;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;font-weight:400}
  .tip-r:hover::after{left:auto;right:0;transform:none}
  .hero-bg{background:radial-gradient(1200px 400px at 10% -20%,#c7d2fe 0,transparent 60%),radial-gradient(900px 400px at 100% 0,#fbcfe8 0,transparent 55%),#f8fafc}
  .btn{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;font-size:12px;border-radius:8px;border:1px solid;font-weight:500;transition:all .12s}
  .btn:hover{transform:translateY(-1px)}
  .step-done{background:#10b981;color:#fff;border-color:#10b981}
  .step-now{background:#4f46e5;color:#fff;border-color:#4f46e5;box-shadow:0 0 0 4px rgba(99,102,241,.25)}
  .step-todo{background:#fff;color:#94a3b8;border-color:#cbd5e1}
  @keyframes fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(540deg);opacity:.8}}
  .confetti{position:fixed;top:0;z-index:70;font-size:24px;animation:fall 3.2s linear forwards;pointer-events:none}
  @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .18s ease-out}
  #spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(15,23,42,.68);transition:all .3s;pointer-events:none;z-index:80}
  #tourCard{position:fixed;z-index:81;width:min(340px,92vw)}
</style>
</head>
<body class="bg-slate-50 text-slate-800">

<header class="bg-white/90 backdrop-blur border-b sticky top-0 z-40">
  <div class="max-w-[1500px] mx-auto px-4 py-2 flex flex-wrap items-center gap-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-fuchsia-500 text-white font-black grid place-items-center">R</div>
      <div><div class="font-extrabold text-slate-900 leading-none">RelayTrace</div>
      <div class="text-[11px] text-slate-500 hidden md:block leading-tight">every handover claim comes with a receipt</div></div>
    </div>
    <div class="flex-1"></div>
    <label class="text-xs text-slate-500 tip" data-tip="Each project is one handover. Pick one or create a new demo.">Project
      <select id="projSel" class="ml-1 border rounded-lg px-2 py-1 text-sm bg-white"></select></label>
    <label id="roleBox" class="text-xs text-slate-500 tip" data-tip="Same data, three different views. Try each one: the server enforces what every role can see.">Viewing as
      <select id="roleSel" class="ml-1 border rounded-lg px-2 py-1 text-sm bg-white font-medium">
        <option value="leaver">🧑‍💻 Outgoing contributor</option>
        <option value="manager">🧭 Project lead / manager</option>
        <option value="successor">🎯 Successor</option>
      </select></label>
    <button data-act="tour" class="text-sm font-semibold rounded-lg px-3 py-1.5 bg-gradient-to-r from-fuchsia-500 to-indigo-600 text-white hover:opacity-90 tip" data-tip="A 60-second guided walkthrough that points at each part of the screen.">▶ Take the tour</button>
    <button id="btnDemo" class="text-sm border rounded-lg px-3 py-1.5 hover:bg-slate-100 tip" data-tip="Creates a fresh copy of the PayFlow-Core sample project so you can try the full flow again.">New demo project</button>
    <button id="btnUpload" class="text-sm bg-slate-900 text-white rounded-lg px-3 py-1.5 hover:bg-slate-700 tip tip-r" data-tip="Bring your own GitHub JSON, Slack JSON and Jira/Linear CSV. Secrets are masked before storage.">⬆ Upload exports</button>
  </div>
</header>

<div id="toast" class="fixed top-16 right-4 z-[90] hidden px-4 py-2 rounded-lg shadow-lg text-sm"></div>
<main class="max-w-[1500px] mx-auto px-4 py-4"><div id="app"></div></main>

<!-- generic dialog -->
<div id="dlg" class="fixed inset-0 bg-black/45 z-[85] hidden items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-lg pop">
    <h2 id="dlgTitle" class="font-bold text-lg"></h2>
    <p id="dlgDesc" class="text-sm text-slate-500 mt-1"></p>
    <textarea id="dlgText" rows="5" class="hidden mt-3 w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
    <div class="flex justify-end gap-2 mt-4">
      <button id="dlgNo" class="px-3 py-1.5 text-sm border rounded-lg hover:bg-slate-50">Cancel</button>
      <button id="dlgYes" class="px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">OK</button>
    </div>
  </div>
</div>

<!-- upload modal -->
<div id="modal" class="fixed inset-0 bg-black/45 z-[85] hidden items-center justify-center p-4">
  <form id="upForm" class="bg-white rounded-2xl shadow-2xl p-5 w-full max-w-lg space-y-3 pop">
    <h2 class="font-bold text-lg">Upload project exports</h2>
    <p class="text-xs text-slate-500">Offline files only. Secrets are masked <b>before</b> anything is stored. Provide at least one file.
      No files handy? Grab the samples:
      <a class="text-indigo-600 underline" href="/api/demo-files/github.json">github.json</a>,
      <a class="text-indigo-600 underline" href="/api/demo-files/slack.json">slack.json</a>,
      <a class="text-indigo-600 underline" href="/api/demo-files/jira.csv">jira.csv</a>.</p>
    <div class="grid grid-cols-2 gap-3">
      <label class="text-sm">Project name<input name="name" class="mt-1 w-full border rounded-lg px-2 py-1" value="My project"></label>
      <label class="text-sm">Leaver's username<input name="leaver" placeholder="auto-detect if blank" class="mt-1 w-full border rounded-lg px-2 py-1"></label>
    </div>
    <label class="text-sm block">🐙 GitHub export (.json)<input type="file" name="github" accept=".json" class="mt-1 block w-full text-sm"></label>
    <label class="text-sm block">💬 Slack export (.json)<input type="file" name="slack" accept=".json" class="mt-1 block w-full text-sm"></label>
    <label class="text-sm block">🎫 Jira / Linear export (.csv)<input type="file" name="jira" accept=".csv" class="mt-1 block w-full text-sm"></label>
    <div class="flex justify-end gap-2 pt-2">
      <button type="button" id="upCancel" class="px-3 py-1.5 text-sm border rounded-lg">Cancel</button>
      <button class="px-3 py-1.5 text-sm bg-indigo-600 text-white rounded-lg">Build dossier</button>
    </div>
  </form>
</div>

<div id="tourLayer" class="hidden"><div id="spot"></div><div id="tourCard" class="bg-white rounded-2xl shadow-2xl p-4 pop"></div></div>

<script>
const S = {role: 'leaver', pid: null, data: null, selSource: null, selClaim: null, err: null,
           open: {decisions: true, unfinished: true, risks: false, contacts: false, gaps: true}, guide: true};
try { if (localStorage.getItem('rt_guide') === '0') S.guide = false; } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

const BUCKETS = [
  ['decisions', '⚖️', 'Key decisions made', 'The "why" behind how the system is built. Read these first so you do not undo a choice by accident.'],
  ['unfinished', '🚧', 'Unfinished work & blockers', 'Half-done branches, open PRs and tickets, and what is stuck. This is your Day-1 to-do list.'],
  ['risks', '🧠', 'Bus-factor risk', 'Files that only one person has ever touched. If they leave, this knowledge leaves too.'],
  ['contacts', '👥', 'Contextual contacts', 'Who to ask about which area, based on who really reviewed and discussed the work.'],
  ['gaps', '🕳️', 'Missing evidence', 'Critical questions that no source answers. Better to know what is unknown than to assume.']
];
const BADGE = {
  'SOURCE-BACKED': 'bg-emerald-100 text-emerald-800', 'STATED BY LEAVER': 'bg-sky-100 text-sky-800',
  'INFERRED': 'bg-violet-100 text-violet-800', 'CONFLICT': 'bg-amber-100 text-amber-800', 'MISSING EVIDENCE': 'bg-rose-100 text-rose-800'
};
const TRUST_HELP = {
  'SOURCE-BACKED': ['✅', 'A verbatim quote exists in a commit, PR, ticket or chat. Click the source link to see it highlighted.'],
  'STATED BY LEAVER': ['🗣️', 'The outgoing person wrote this themselves (debrief answer or gap fill). Trusted, but not from a document.'],
  'INFERRED': ['🧮', 'Calculated from patterns, e.g. "only one person ever edited this file". Useful signal, not a quote.'],
  'CONFLICT': ['⚡', 'Two sources disagree (Slack says Redis, a ticket says Kafka). A human must pick the current truth.'],
  'MISSING EVIDENCE': ['❓', 'Nothing in the exports answers this. It is routed to the person most likely to know.']
};
const ROLE_INFO = {
  leaver: ['🧑‍💻', 'You are the outgoing contributor.', 'You answer the debrief, settle conflicts, approve or reject every claim, choose what the successor can see, then lock and release.'],
  manager: ['🧭', 'You are the project lead.', 'Read-only oversight. You see every claim, including rejected and manager-only ones, plus the secret-redaction report.'],
  successor: ['🎯', 'You are the successor.', 'You only see claims the leaver approved and shared, after the handover is released. Every claim still links to its original evidence.']
};
const ATTR_GROUPS = [['unmerged branch', 'Branches never merged'], ['open PR', 'Open pull requests'], ['open ticket', 'Tickets still assigned to the leaver'], ['blocker', 'Blockers & caveats']];

let toastT;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'fixed top-16 right-4 z-[90] px-4 py-2 rounded-lg shadow-lg text-sm pop ' + (bad ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3500);
}

async function api(path, opts = {}) {
  const headers = {'X-Role': S.role, ...(opts.headers || {})};
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const r = await fetch('/api' + path, {...opts, headers});
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.detail) || r.statusText);
  return j;
}
const post = (p, b) => api(p, {method: 'POST', body: b === undefined ? undefined : JSON.stringify(b)});

/* ---------- dialogs ---------- */
function dialog({title, desc, text, yes = 'OK', danger}) {
  return new Promise(res => {
    const d = $('#dlg'), ta = $('#dlgText');
    $('#dlgTitle').textContent = title; $('#dlgDesc').textContent = desc || '';
    ta.classList.toggle('hidden', text === undefined); ta.value = text || '';
    $('#dlgYes').textContent = yes;
    $('#dlgYes').className = 'px-3 py-1.5 text-sm text-white rounded-lg ' + (danger ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-indigo-600 hover:bg-indigo-700');
    d.style.display = 'flex';
    const done = v => { d.style.display = 'none'; res(v); };
    $('#dlgYes').onclick = () => done(text === undefined ? true : ta.value);
    $('#dlgNo').onclick = () => done(null);
    if (text !== undefined) setTimeout(() => ta.focus(), 50);
  });
}

/* ---------- loading ---------- */
async function loadProjects(selectId) {
  const list = await api('/projects');
  const sel = $('#projSel');
  sel.innerHTML = list.map(p => `<option value="${p.id}">#${p.id} ${esc(p.name)} ${p.status === 'locked' ? '(released)' : ''}</option>`).join('');
  if (!list.length) { S.pid = null; return; }
  S.pid = selectId || (list.find(p => String(p.id) === String(S.pid)) ? S.pid : list[0].id);
  sel.value = S.pid;
}
async function loadDossier() {
  S.err = null;
  if (!S.pid) { S.data = null; render(); return; }
  try { S.data = await api('/projects/' + S.pid); } catch (e) { S.data = null; S.err = e.message; }
  render();
}
const allClaims = d => Object.values(d.buckets).flat();

/* ---------- claim UI ---------- */
function btn(act, id, icon, label, cls, tip) {
  return `<button data-act="${act}" data-id="${id}" data-tip="${esc(tip)}" class="btn tip ${cls}">${icon} ${label}</button>`;
}
function claimButtons(c, locked) {
  if (S.role !== 'leaver' || locked) return '';
  let h = '';
  const open = c.trust !== 'CONFLICT' && c.trust !== 'MISSING EVIDENCE';
  if (c.status === 'pending' && open) h += btn('approve', c.id, '✓', 'Approve', 'border-emerald-300 text-emerald-700 hover:bg-emerald-50', 'Confirm this is accurate. Only approved claims can reach the successor.');
  if (c.status !== 'rejected') h += btn('reject', c.id, '✕', 'Reject', 'border-rose-300 text-rose-700 hover:bg-rose-50', 'This is wrong or irrelevant. It will never be shown to the successor.');
  if (c.status !== 'pending') h += btn('reset', c.id, '↺', 'Undo', 'border-slate-300 text-slate-600 hover:bg-slate-50', 'Put this claim back to pending so you can decide again.');
  if (c.trust !== 'CONFLICT') h += btn('edit', c.id, '✎', c.trust === 'MISSING EVIDENCE' ? 'Answer this' : 'Edit',
    c.trust === 'MISSING EVIDENCE' ? 'bg-rose-600 border-rose-600 text-white hover:bg-rose-700' : 'border-slate-300 text-slate-700 hover:bg-slate-50',
    c.trust === 'MISSING EVIDENCE' ? 'Type the answer yourself. It becomes a [STATED BY LEAVER] claim and is approved.' : 'Reword this claim. Your edit is approved automatically and the original stays visible.');
  h += c.visibility === 'all'
    ? btn('vis', c.id, '👁', 'Shared', 'border-slate-300 text-slate-600 hover:bg-slate-50', 'The successor will see this once approved. Click to make it manager-only.')
    : btn('vis', c.id, '🔒', 'Manager only', 'border-amber-300 bg-amber-50 text-amber-800', 'Hidden from the successor, visible to managers. Click to share it.');
  return h;
}
function badge(c) {
  return `<span class="tip shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded ${BADGE[c.trust]}" data-tip="${esc(TRUST_HELP[c.trust][1])}">${TRUST_HELP[c.trust][0]} ${c.trust}</span>`;
}
function claimCard(c, locked) {
  const sel = S.selClaim === c.id ? 'sel' : '';
  const rej = c.status === 'rejected' ? 'opacity-50' : '';
  const src = c.source ? `<button data-act="src" data-id="${c.source.id}" data-claim="${c.id}" class="tip px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 hover:bg-indigo-100" data-tip="Open the original ${esc(c.source.type)} with the proof highlighted.">🔎 ${esc(c.source.type)} · ${esc(c.source.ref)}</button>`
    : '<span class="text-rose-600">no source yet</span>';
  const status = S.role === 'successor' ? '' :
    `<span class="px-1.5 rounded ${c.status === 'approved' ? 'bg-emerald-50 text-emerald-700' : c.status === 'rejected' ? 'bg-rose-50 text-rose-700' : 'bg-amber-50 text-amber-700'}">${c.status}</span>`;
  const routed = c.routed_to ? `<span class="px-1.5 rounded bg-rose-50 text-rose-700">ask the ${esc(c.routed_to)}</span>` : '';
  return `<div class="card bg-white border rounded-xl p-3 ${sel} ${rej}" data-card="${c.id}">
    <div class="flex gap-2 items-start">${badge(c)}<p class="text-sm flex-1 ${c.status === 'rejected' ? 'line-through' : ''}">${fmt(c.text)}</p></div>
    ${c.edited && c.original ? `<div class="text-xs text-slate-400 mt-1">edited · original: ${fmt(c.original)}</div>` : ''}
    <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-500">
      <span class="px-1.5 rounded bg-slate-100">${esc(c.component)}</span>${c.timestamp ? `<span>${esc(c.timestamp.slice(0, 10))}</span>` : ''}
      ${src} ${status} ${routed}</div>
    <div class="mt-2 flex flex-wrap gap-1.5">${claimButtons(c, locked)}</div></div>`;
}
function conflictBox(group, items, locked) {
  const vals = items.map(c => c.value).join(' or ');
  const cards = items.map(c => `<div class="card bg-white border border-amber-300 rounded-xl p-3 ${S.selClaim === c.id ? 'sel' : ''}" data-card="${c.id}">
      <div class="flex items-center gap-2 mb-1"><span class="text-sm font-bold text-amber-800">${esc(c.value)}</span>
        ${c.suggested ? '<span class="tip text-[10px] px-1.5 rounded bg-emerald-100 text-emerald-800" data-tip="Our rule: a newer source with higher weight (commit > PR > ticket > chat) is probably right. You still decide.">★ suggested: newest, strongest source</span>' : ''}</div>
      <p class="text-sm">“${esc(c.quote)}”</p>
      <div class="mt-2 text-xs text-slate-500 flex flex-wrap items-center gap-2"><span>${esc((c.timestamp || '').slice(0, 10))}</span>
        <button data-act="src" data-id="${c.source.id}" data-claim="${c.id}" class="px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 hover:bg-indigo-100">🔎 ${esc(c.source.type)} · ${esc(c.source.ref)}</button></div>
      ${S.role === 'leaver' && !locked ? `<button data-act="winner" data-id="${c.id}" class="tip mt-2 btn bg-indigo-600 border-indigo-600 text-white hover:bg-indigo-700" data-tip="Marks ${esc(c.value)} as correct and automatically rejects the other side.">✔ ${esc(c.value)} is current</button>` : ''}</div>`).join('');
  return `<div id="conflictBox" class="border-2 border-amber-300 bg-gradient-to-br from-amber-50 to-white rounded-2xl p-4">
    <div class="flex items-start gap-2 mb-1"><span class="text-2xl">⚡</span><div>
      <div class="font-bold text-amber-900">Conflict: ${esc(vals)}?</div>
      <div class="text-xs text-slate-600">Two sources disagree about <b>${esc(group)}</b>. Read both receipts, then tell RelayTrace which one is true today.</div></div></div>
    <div class="grid md:grid-cols-2 gap-2 mt-2">${cards}</div>
    ${S.role === 'leaver' && !locked ? `<button data-act="unknown" data-id="${items[0].id}" class="tip mt-2 text-xs underline text-slate-600" data-tip="Rejects both sides and creates a Missing-evidence item for the manager to resolve.">I don't know which is current. Mark as unknown</button>` : ''}</div>`;
}

function section(key, icon, title, sub, items, locked, d) {
  if (!items.length) return '';
  const isOpen = S.open[key];
  const pend = items.filter(c => c.status === 'pending' && c.trust !== 'CONFLICT' && c.trust !== 'MISSING EVIDENCE').length;
  const apprN = items.filter(c => c.status === 'approved').length;
  let body = '';
  if (isOpen) {
    if (key === 'decisions') {
      const open = {};
      items.filter(c => c.trust === 'CONFLICT' && c.status === 'pending').forEach(c => (open[c.conflict_group] = open[c.conflict_group] || []).push(c));
      body += Object.entries(open).map(([g, it]) => conflictBox(g, it, locked)).join('');
      body += items.filter(c => !(c.trust === 'CONFLICT' && c.status === 'pending')).map(c => claimCard(c, locked)).join('');
    } else if (key === 'unfinished') {
      for (const [attr, label] of ATTR_GROUPS) {
        const g = items.filter(c => c.attribute === attr);
        if (g.length) body += `<div class="text-[11px] font-bold uppercase tracking-wide text-slate-400 pt-1">${label} · ${g.length}</div>` + g.map(c => claimCard(c, locked)).join('');
      }
      const other = items.filter(c => !ATTR_GROUPS.some(a => a[0] === c.attribute));
      body += other.map(c => claimCard(c, locked)).join('');
    } else body = items.map(c => claimCard(c, locked)).join('');
  }
  const bulk = S.role === 'leaver' && !locked && pend ? `<button data-act="bulk" data-key="${key}" class="tip btn border-emerald-300 text-emerald-700 hover:bg-emerald-50" data-tip="Approve the ${pend} pending claim(s) in this section in one click. You can still reject or edit any of them later.">✓ Approve ${pend}</button>` : '';
  return `<section id="sec-${key}" class="space-y-2">
    <div class="flex items-center gap-2 bg-white border rounded-xl px-3 py-2 cursor-pointer hover:bg-slate-50" data-act="toggle" data-key="${key}">
      <span class="text-xl">${icon}</span>
      <div class="flex-1 min-w-0"><div class="font-bold">${title} <span class="text-xs text-slate-400 font-normal">${items.length} item${items.length > 1 ? 's' : ''}${S.role !== 'successor' ? ` · ${apprN} approved` : ''}</span></div>
        <div class="text-xs text-slate-500">${sub}</div></div>
      ${bulk}<span class="text-slate-400 text-sm w-4 text-center">${isOpen ? '▾' : '▸'}</span></div>
    ${body ? `<div class="space-y-2 pl-1">${body}</div>` : ''}</section>`;
}

/* ---------- roadmap, steps, panels ---------- */
function roadmap(b) {
  const items = [];
  const conf = (b.decisions || []).filter(c => c.trust === 'CONFLICT' && c.status === 'pending');
  if (conf.length) {
    const g = conf[0].conflict_group.split('/');
    items.push(['Decide', `Which ${g[1]} does ${g[0]} use today: ${[...new Set(conf.map(c => c.value))].join(' or ')}?`, conf[0]]);
  }
  (b.unfinished || []).filter(c => c.attribute === 'unmerged branch').slice(0, 3).forEach(c => items.push(['Finish', c.text, c]));
  (b.unfinished || []).filter(c => c.attribute === 'open PR').slice(0, 1).forEach(c => items.push(['Finish', c.text, c]));
  const r = (b.risks || [])[0];
  if (r) items.push(['Protect', `${b.risks.length} file(s) only one person understands. Start with: ${r.text.replace(/ has only ever.*/, '')}`, r]);
  (b.gaps || []).slice(0, 2).forEach(c => items.push(['Find out', c.text.replace('No source answers: ', ''), c]));
  return items.slice(0, 8);
}
const TAG = {Decide: 'bg-amber-100 text-amber-800', Finish: 'bg-indigo-100 text-indigo-800', Protect: 'bg-violet-100 text-violet-800', 'Find out': 'bg-rose-100 text-rose-800'};

function steps(d) {
  const st = d.stats, b = d.buckets, locked = d.project.status === 'locked';
  const all = allClaims(d);
  const reviewPending = all.filter(c => c.status === 'pending' && c.trust !== 'CONFLICT' && c.trust !== 'MISSING EVIDENCE').length;
  const gapsOpen = (b.gaps || []).filter(c => c.status === 'pending').length;
  const list = [

async function act(el) {

    if (a === 'toggle') { S.open[el.dataset.key] = !S.open[el.dataset.key]; return render(); }
    if (a === 'guide') { S.guide = !S.guide; try { localStorage.setItem('rt_guide', S.guide ? '1' : '0'); } catch (e) {} return render(); }
    if (a === 'go') { const t = document.querySelector(el.dataset.sel); if (t) t.scrollIntoView({behavior: 'smooth', block: 'center'}); else toast('Nothing to do here. This step is already clear.'); return; }
    if (a === 'tour') return startTour();
    if (a === 'asLeaver') { $('#roleSel').value = S.role = 'leaver'; return loadDossier(); }
    if (a === 'asSuccessor') { $('#roleSel').value = S.role = 'successor'; S.selSource = null; return loadDossier(); }
    if (a === 'approve' || a === 'reject' || a === 'reset') await post(`/claims/${id}/action`, {action: a});
    else if (a === 'vis') {
      const c = allClaims(S.data).find(x => x.id == id);
      await post(`/claims/${id}/action`, {action: 'visibility', visibility: c.visibility === 'all' ? 'manager' : 'all'});
    } else if (a === 'edit') {
      const c = allClaims(S.data).find(x => x.id == id), gap = c.trust === 'MISSING EVIDENCE';
      const t = await dialog({title: gap ? 'Answer this question' : 'Edit this claim', desc: gap ? c.text.replace('No source answers: ', '') + ' Your answer becomes a STATED BY LEAVER claim.' : 'Your wording replaces the text shown to the successor. The original stays visible to you and the manager.', text: gap ? '' : c.text, yes: 'Save'});

    else if (a === 'unknown') { await post(`/claims/${id}/resolve`, {mode: 'unknown'}); toast('Marked unknown and sent to the manager as a gap.'); }
    else if (a === 'debrief') {

    card.innerHTML = `<div class="text-[11px] text-indigo-600 font-bold">STEP ${tour.i + 1} OF ${tour.steps.length}</div><div class="font-bold mt-0.5">${s.t}</div>
      <p class="text-sm text-slate-600 mt-1">${s.x}</p><div class="flex justify-between mt-3"><button id="tSkip" class="text-xs text-slate-500">Skip tour</button>
      <div class="flex gap-2">${tour.i ? '<button id="tBack" class="btn border-slate-300">Back</button>' : ''}<button id="tNext" class="btn bg-indigo-600 border-indigo-600 text-white">${last ? 'Finish ✓' : 'Next →'}</button></div></div>`;
    const below = r.bottom + 12 + 190 < window.innerHeight;
    card.style.top = (below ? r.bottom + 14 : Math.max(10, r.top - 200)) + 'px';
    card.style.left = Math.min(Math.max(10, r.left), window.innerWidth - 350) + 'px';
    $('#tNext').onclick = () => { tour.i++; showTour(); };
    $('#tSkip').onclick = endTour; if ($('#tBack')) $('#tBack').onclick = () => { tour.i--; showTour(); };
  }, 380);
}
function endTour() { $('#tourLayer').classList.add('hidden'); }

/* ---------- wiring ---------- */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) { if (el.dataset.act === 'toggle' && e.target.closest('button:not([data-act="toggle"])')) { const inner = e.target.closest('button'); if (inner.dataset.act === 'bulk') return act(inner); } act(el); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { endTour(); $('#dlg').style.display = 'none'; $('#modal').style.display = 'none'; } });
$('#roleSel').onchange = e => { S.role = e.target.value; S.selSource = null; S.selClaim = null; loadDossier(); };
$('#projSel').onchange = e => { S.pid = e.target.value; S.selSource = null; loadDossier(); };
$('#btnDemo').onclick = createDemo;
$('#btnUpload').onclick = () => { $('#modal').style.display = 'flex'; };
$('#upCancel').onclick = () => { $('#modal').style.display = 'none'; };
$('#upForm').onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  for (const k of ['github', 'slack', 'jira']) { const f = fd.get(k); if (f && !f.name) fd.delete(k); }
  try { const r = await api('/ingest', {method: 'POST', body: fd}); $('#modal').style.display = 'none'; S.selSource = null; await loadProjects(r.id); await loadDossier(); toast('Dossier built'); }
  catch (err) { toast(err.message, true); }
};
(async () => { await loadProjects(); await loadDossier(); })();
</script>
